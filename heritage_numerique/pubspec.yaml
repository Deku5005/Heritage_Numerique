name: heritage_numerique
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  video_player: ^2.8.1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1
  just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # TRÈS IMPORTANT : on déclare le fichier .env comme asset
  assets:
    - assets/images/
    - .env                # CELA RÉSOUT TON ERREUR DE CHARGEMENT !